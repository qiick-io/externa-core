name: Report a bug
description: Create a report to help us improve Externa
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Before filing, please check:
        - You're on a recent version of Externa (externa-core)
        - There's [no existing issue](https://github.com/qiick-io/externa-core/issues?q=is%3Aissue) that already describes the problem

  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior. Include route/page, role/permissions, and any relevant logs if helpful.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots or screen recordings to help explain the problem.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Fill in what you know. Leave blank if not applicable.
      placeholder: |
        Externa / app version:
        PHP version:
        Node version:
        Browser:
        OS:
        Self-hosted notes (Docker, reverse proxy, etc.):
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help (related PRs, stack traces, feature flags).
