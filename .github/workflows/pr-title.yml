name: PR title

# The PR title becomes the squash commit on develop: it must be a Conventional Commit (#610).
# `edited` reruns the check when the title changes. Check name: `pr-title / commitlint`.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # The event is part of the group: the pull-request run and the push run on one commit are
  # separate evidence and must not cancel each other. On develop and main nothing is cancelled
  # in progress — a cancelled run is indistinguishable from a check that never ran (#805).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  pr-title:
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@v0.9.0
