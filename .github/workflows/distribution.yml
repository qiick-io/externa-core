# Self-hosted distribution smoke (qiick standards): create-project from this
# commit, non-interactive externa:install, /health/live and /health/ready, and
# externa:upgrade from the previous release tag.
name: distribution

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    uses: qiick-io/app-ui/.github/workflows/app-distribution-smoke.yml@v0.11.0
    with:
      package: qiick/externa-core
      command: externa
