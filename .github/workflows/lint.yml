name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-8.4-

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Prepare Application
        run: |
          cp .env.example .env
          php artisan key:generate
          # actions/routes are gitignored; without them import/order misclassifies @/actions|@/routes as unknown
          php artisan wayfinder:generate --with-form --no-interaction

      - name: Run Pint
        run: composer lint:check

      - name: Run PHPStan (Larastan)
        run: composer analyse

      - name: Lint Frontend
        run: npm run lint:check -- --max-warnings=0

      - name: Format Frontend
        run: npm run format:check

      - name: Typecheck Frontend
        run: npm run types:check

      - name: Frontend unit tests (Vitest)
        run: npm run test:unit
