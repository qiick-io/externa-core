# Track B — production-oriented Compose (no Vite, no Mailpit, no Sail).
# Usage:
#   cp .env.docker.prod.example .env
#   docker compose -f compose.prod.yaml up --build -d
#
# Put TLS / reverse proxy in front (Caddy/Traefik/nginx). Set TRUSTED_PROXIES.
# Reverb WebSockets: proxy Upgrade headers to reverb:8080 (or publish REVERB_HOST_PORT).

name: externa-prod

services:
  app:
    build:
      context: .
      target: production
    command: ["app"]
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      CACHE_CONFIG: "true"
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-pgsql}"
      DB_PORT: "${DB_PORT:-5432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - externa_prod_storage:/var/www/html/storage
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - externa-prod
    restart: unless-stopped

  horizon:
    build:
      context: .
      target: production
    command: ["horizon"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-pgsql}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      QUEUE_CONNECTION: redis
    volumes:
      - externa_prod_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - externa-prod
    restart: unless-stopped

  reverb:
    build:
      context: .
      target: production
    command: ["reverb"]
    ports:
      - "${REVERB_HOST_PORT:-8081}:8080"
    env_file:
      - .env
    environment:
      APP_ENV: production
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - externa-prod
    restart: unless-stopped

  scheduler:
    build:
      context: .
      target: production
    command: ["scheduler"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-pgsql}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      QUEUE_CONNECTION: redis
    volumes:
      - externa_prod_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - externa-prod
    restart: unless-stopped

  pulse:
    build:
      context: .
      target: production
    command: ["pulse"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      REDIS_HOST: "${REDIS_HOST:-redis}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - externa-prod
    restart: unless-stopped

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE:-externa}"
      POSTGRES_USER: "${DB_USERNAME:-externa}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-change-me}"
    volumes:
      - externa_prod_pgsql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-externa} -d ${DB_DATABASE:-externa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - externa-prod
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - externa_prod_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - externa-prod
    restart: unless-stopped

volumes:
  externa_prod_storage:
  externa_prod_pgsql:
  externa_prod_redis:

networks:
  externa-prod:
    driver: bridge
