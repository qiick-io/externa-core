# Contributor local hooks. CI remains source of truth.
# Skip: LEFTHOOK=0 git commit …   or   git commit --no-verify (discouraged)
# Install: npm ci   (prepare → lefthook install when .git present; no-op otherwise)

pre-commit:
  parallel: true
  commands:
    pint:
      glob: "*.php"
      run: vendor/bin/pint --dirty
    eslint:
      glob: "resources/js/**/*.{js,jsx,ts,tsx}"
      run: npx eslint {staged_files} --max-warnings=0
    prettier:
      glob: "resources/**/*.{js,jsx,ts,tsx,css}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    pint-test:
      run: vendor/bin/pint --parallel --test
    eslint:
      run: npm run lint:check
    # Skip full Pest / browser suite — CI owns that.
