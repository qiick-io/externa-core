# Contributor local hooks. CI remains source of truth.
# Skip: LEFTHOOK=0 git commit …   or   git commit --no-verify (discouraged)
# Install: npm ci   (prepare → lefthook install when .git present; no-op otherwise)

pre-commit:
  parallel: true
  commands:
    pint:
      glob: '*.php'
      run: vendor/bin/pint {staged_files}
      stage_fixed: true
    oxlint:
      glob: 'resources/js/**/*.{js,jsx,ts,tsx}'
      # Ignored paths (shadcn primitives in components/ui) come from vite.config.ts.
      run: npx vp lint {staged_files} --max-warnings=0
    oxfmt:
      glob: 'resources/**/*.{js,jsx,ts,tsx,css}'
      run: npx vp fmt {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    pint-test:
      run: vendor/bin/pint --parallel --test
    oxlint:
      run: npm run lint:check
    # Skip full Pest / browser suite — CI owns that.
