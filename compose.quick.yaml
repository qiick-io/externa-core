# Quick deploy — pull published GHCR image (no local build).
# Usage:
#   cp .env.docker.quick.example .env
#   # set APP_KEY, DB_PASSWORD, APP_URL, INITIAL_SUPER_ADMIN_*
#   docker compose -f compose.quick.yaml up -d
#
# Image override (local bake / smoke):
#   EXTERNA_IMAGE=externa:prod docker compose -f compose.quick.yaml up -d
#
# First boot: RUN_MIGRATIONS=true (default here). Seed/admin only when RUN_SEED=true.
# After bootstrap: set RUN_SEED=false (and optionally RUN_MIGRATIONS=false).
# TLS / proxy: see docs Reverse proxy (#17). Managed DB/Redis: compose.prod.managed.yaml (#15).

name: externa-quick

services:
  app:
    image: ${EXTERNA_IMAGE:-ghcr.io/qiick-io/externa-core:latest}
    command: ["app"]
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      RUN_SEED: "${RUN_SEED:-false}"
      CACHE_CONFIG: "true"
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-pgsql}"
      DB_PORT: "${DB_PORT:-5432}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - externa_quick_storage:/var/www/html/storage
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - externa-quick
    restart: unless-stopped

  horizon:
    image: ${EXTERNA_IMAGE:-ghcr.io/qiick-io/externa-core:latest}
    command: ["horizon"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-pgsql}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      QUEUE_CONNECTION: redis
    volumes:
      - externa_quick_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - externa-quick
    restart: unless-stopped

  reverb:
    image: ${EXTERNA_IMAGE:-ghcr.io/qiick-io/externa-core:latest}
    command: ["reverb"]
    ports:
      - "${REVERB_HOST_PORT:-8081}:8080"
    env_file:
      - .env
    environment:
      APP_ENV: production
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - externa-quick
    restart: unless-stopped

  scheduler:
    image: ${EXTERNA_IMAGE:-ghcr.io/qiick-io/externa-core:latest}
    command: ["scheduler"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-pgsql}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      QUEUE_CONNECTION: redis
    volumes:
      - externa_quick_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - externa-quick
    restart: unless-stopped

  pulse:
    image: ${EXTERNA_IMAGE:-ghcr.io/qiick-io/externa-core:latest}
    command: ["pulse"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      REDIS_HOST: "${REDIS_HOST:-redis}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - externa-quick
    restart: unless-stopped

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE:-externa}"
      POSTGRES_USER: "${DB_USERNAME:-externa}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-change-me}"
    volumes:
      - externa_quick_pgsql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-externa} -d ${DB_DATABASE:-externa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - externa-quick
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - externa_quick_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - externa-quick
    restart: unless-stopped

volumes:
  externa_quick_storage:
  externa_quick_pgsql:
  externa_quick_redis:

networks:
  externa-quick:
    driver: bridge
