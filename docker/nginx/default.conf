server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Public assets disk: never execute; sandbox CSP reduces stored-XSS blast radius.
    location ^~ /storage/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'none'; script-src 'none'; object-src 'none'; base-uri 'none'" always;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        # Debian nginx maps HTTP_HOST to $host (no port). Preserve client Host
        # so Compose published ports (e.g. localhost:8000→80) keep :8000 in URLs.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 600s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # Never pass PHP_* admin/value overrides via FastCGI (CVE-2026-109619 / GHSA-6wmf-4rv5-p3rp).
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
