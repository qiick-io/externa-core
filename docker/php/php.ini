; Externa PHP runtime (copied to conf.d/zz-externa.ini).
; Hardening for CVE-2026-109618 / CVE-2026-109619 (GHSA-w8hw-w9fx-j79w, GHSA-6wmf-4rv5-p3rp).
; Keep upload progress Off even on patched PHP; Externa does not use it.
; Body limits match docker/nginx/default.conf client_max_body_size (100M).
; Do not set memory_limit=-1 (advisory partial mitigation only with documented cgroup limits).
; Never inject PHP_VALUE / PHP_ADMIN_VALUE from nginx (see docker/nginx/default.conf).

memory_limit=512M
upload_max_filesize=100M
post_max_size=100M
max_execution_time=120
max_input_vars=3000
max_input_nesting_level=64
max_file_uploads=20

session.upload_progress.enabled=0
session.use_strict_mode=1
